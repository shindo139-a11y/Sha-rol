<head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* Capa Firebase: reemplaza window.claude (db + user) usando Firestore y Auth anónimo. */
(function(){
  // Pega aquí tu UID de administrador (lo ves en Perfil, "Tu ID").
  var ADMIN_UIDS=['PEGA_AQUI_TU_UID'];
  firebase.initializeApp({
    apiKey:"AIzaSyC0ngF0YHAHxRFAhYYimcw5rSVn6FhwhSM",
    authDomain:"sha-rol.firebaseapp.com",
    projectId:"sha-rol",
    storageBucket:"sha-rol.firebasestorage.app",
    messagingSenderId:"387296914047",
    appId:"1:387296914047:web:ed80a077be35eefb83ed4a"
  });
  var auth=firebase.auth(),fs=firebase.firestore();
  var authP=new Promise(function(res){
    var un=auth.onAuthStateChanged(function(u){
      if(u){un();res(u)}
      else auth.signInAnonymously().catch(function(){res(null)});
    });
  });
  window.claude={use:function(n){
    if(n==='db')return Promise.resolve(fs);
    if(n==='user')return authP.then(function(u){return {
      id:function(){return Promise.resolve(u?u.uid:null)},
      can:function(){return Promise.resolve(true)},
      canEdit:function(){return Promise.resolve(!!u&&ADMIN_UIDS.indexOf(u.uid)>=0)}
    }});
    return Promise.resolve(null);
  }};
})();
</script>
<link rel="stylesheet" href="style.css">
</head>

<div class="app"><main id="main"></main></div>

</body>
